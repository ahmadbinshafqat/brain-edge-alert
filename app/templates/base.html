<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edge Alert</title>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #f6f7fb; color: #172033; }
    header { background: #172033; color: white; padding: 1rem 2rem; }
    main { max-width: 980px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: white; border-radius: 14px; padding: 1.25rem; box-shadow: 0 8px 25px rgba(20, 30, 50, .08); margin-bottom: 1rem; }
    .upload { border: 2px dashed #9aa7bd; text-align: center; }
    input[type=file] { margin: 1rem 0; }
    button, .button { background: #2563eb; color: white; border: 0; padding: .7rem 1rem; border-radius: 10px; cursor: pointer; text-decoration: none; display: inline-block; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .7rem; border-bottom: 1px solid #e5e7eb; text-align: left; vertical-align: top; }
    .badge { padding: .25rem .55rem; border-radius: 999px; font-weight: 700; font-size: .85rem; }
    .normal { background: #dcfce7; color: #166534; }
    .review { background: #fef3c7; color: #92400e; }
    .unusual { background: #fee2e2; color: #991b1b; }
    .seed { background: #e0e7ff; color: #3730a3; }
    pre { white-space: pre-wrap; background: #111827; color: #e5e7eb; padding: 1rem; border-radius: 10px; max-height: 360px; overflow: auto; }
    .muted { color: #64748b; }
  </style>
</head>
<body>
<header><h1>Edge Alert</h1><div class="muted">Local-first receipt and bill anomaly checks</div></header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
